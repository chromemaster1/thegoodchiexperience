{% extends "base.html" %}
{% block title %}Edit Track — Goodchi Admin{% endblock %}

{% block content %}
<div style="padding-top:90px;max-width:700px;margin:0 auto;padding-bottom:60px">

  <div style="margin-bottom:24px">
    <h1 style="font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;color:var(--text-1)">
      ✏️ Edit Track
    </h1>
    <p style="font-size:13px;color:var(--text-2)">{{ item.title }}</p>
  </div>

  <div class="orbit-card" style="padding:32px">
    <form method="POST" action="{{ url_for('admin_edit_download', item_id=item.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="admin-form-row">
        <div>
          <label class="admin-label">Track title *</label>
          <input name="title" class="admin-input" value="{{ item.title }}" required />
        </div>
        <div>
          <label class="admin-label">Artist</label>
          <input name="artist" class="admin-input" value="{{ item.artist or '' }}" />
        </div>
      </div>

      <div class="admin-form-row">
        <div>
          <label class="admin-label">Album / EP</label>
          <input name="album" class="admin-input" value="{{ item.album or '' }}" />
        </div>
        <div>
          <label class="admin-label">Producer</label>
          <input name="producer" class="admin-input" value="{{ item.producer or '' }}" />
        </div>
      </div>

      <div class="admin-form-row">
        <div>
          <label class="admin-label">Audio file path (static folder) *</label>
          <input name="audio_path" class="admin-input" value="{{ item.audio_path }}" required />
          <small style="color:var(--text-3);font-size:11px">Relative to static/ — e.g. <code>audio file/track.mp3</code></small>
        </div>
        <div>
          <label class="admin-label">Stream URL (optional)</label>
          <input name="stream_url" class="admin-input" value="{{ item.stream_url or '' }}" />
        </div>
      </div>

      <div class="admin-form-row">
        <div>
          <label class="admin-label">Description</label>
          <input name="description" class="admin-input" value="{{ item.description or '' }}" />
        </div>
        <div>
          <label class="admin-label">Sort order</label>
          <input name="sort_order" type="number" class="admin-input" value="{{ item.sort_order }}" style="max-width:120px" />
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer">
        <input type="checkbox" name="requires_login" {{ 'checked' if item.requires_login else '' }} style="width:16px;height:16px" />
        <span style="font-size:13px;color:var(--text-2)">Require login to download</span>
      </label>

      <div style="display:flex;gap:12px;margin-top:28px;flex-wrap:wrap">
        <button type="submit" class="btn-primary">Save Changes</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn-ghost">Cancel</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
