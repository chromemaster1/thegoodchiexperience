services:
  - type: web
    name: vaultcore-wallet
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false
      - key: CMC_PRO_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
